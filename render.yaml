# One-click deploy to Render (https://render.com) - free tier.
# In Render: New + → Blueprint → connect this repo. Render reads this file.
services:
  - type: web
    name: ai-business-rag-chatbot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Optional - works without it (BM25 + extractive answers). Add in the
      # dashboard to enable natural, Gemini-written answers.
      - key: GEMINI_API_KEY
        sync: false
